# Run B: Lyot stop in, knife mask in (coronagraphic), at open as in try5, with PSF blocks that take the
# calibration speckles at open and at ND3_0 (the open/ND3_0 transmission, to scale run A's ND3_0 PSF).
# Before starting: fwscind at open, camsci1 EM gain 1.
# Run: xlinqCal -c runB.conf

[dm]
channel=dm01disp02
comb=dm01disp

[poke]
file=modFourier_48_shaped.fits
amp=1

[sci]
shmim=camsci1
nSettle=0
nFrames=1
linearMax=37000
satRadius=0                # not saturated: try5 peaked at 22.7k
device=camsci1

[wfs]
shmim=aol1_imWFS2pub,aol1_modevalWFSpub

[snap]
shmim=aol1_wfsref,aol1_wfsmask

[indi]
enable=true
props=fwfpm.filterName,fwfpm.filter,fwfpm.counts,fwlyot.filterName,fwpupil.filterName,fwsci1.filterName,stagebs.presetName,stagescibs.presetName

[dark]
n=20

[psf]
n=50
wheel=fwscind
filter=ND3_0               # the wheel moves open -> ND3_0 -> open for each block
speckAmp=0.025             # ~25k counts peak at open (try7 CALMAX 24k)
speckSep=14
speckAngle=75              # two of the four speckles are in the transmitted half; psf_flux.py --nspeck 2
speckCross=true

[seq]
nRepeat=1

[ref]
every=1

[out]
dir=try7
prefix=try7
