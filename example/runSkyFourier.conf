# Sky calibration step 1 of 3: Fourier modes through the observation's coronagraph and WFS configuration
# (unmodulated pyramid, NN reconstructor), right after the observation. Same as run C / try7: shaped Fourier modes,
# PSF blocks with calibration speckles at open and at ND3_0. Gives the NN's modevalWFS response to each Fourier mode
# (telem_screens.py --cal, step 2), camflowfs and camsci1 responses, the static field and g(n).
# camflowfs: mirrored to RTC with shmimTCP, and its INDI device visible on RTC (for its shutter during the dark).
# Before starting: internal source, same FPM/Lyot/filter as the observation, the observation's static DM offsets
# restored except the loop channel, fwscind at open, camsci1 at 36 ms, EM gain 1, AO loop and camflowfs T/T loop
# open, turbulence off.
# Run: xlinqCal -c runSkyFourier.conf   (~13 min); then step 2 (see runSky.conf)

[dm]
channel=dm01disp02
comb=dm01disp

[poke]
file=modFourier_48_shaped.fits   # shaped Fourier modes, ordered by max(|nx|,|ny|)
amp=1

[sci]
shmim=camsci1
nSettle=0
nFrames=1
linearMax=37000
satRadius=0                # not saturated: try7 peaked at ~24k
device=camsci1

[wfs]
shmim=aol1_imWFS2pub,aol1_modevalWFSpub,camflowfs

[snap]
shmim=aol1_wfsref,aol1_wfsmask

[indi]
enable=true
props=fwfpm.filterName,fwfpm.filter,fwfpm.counts,fwlyot.filterName,fwpupil.filterName,fwsci1.filterName,stagebs.presetName,stagescibs.presetName

[dark]
n=20
wfs=camflowfs              # its shutter is shut with camsci1's; _camflowfs_dark.fits

[psf]
n=50
wheel=fwscind
filter=ND3_0               # the wheel moves open -> ND3_0 -> open for each block
speckAmp=0.025             # ~25k counts peak at open (try7 CALMAX 24k)
speckSep=14
speckAngle=75              # two of the four speckles are in the transmitted half; psf_flux.py --nspeck 2
speckCross=true

[seq]
nRepeat=1

[ref]
every=1

[out]
dir=skyF1
prefix=skyF1
