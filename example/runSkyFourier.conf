# Sky calibration step 1 of 3: Fourier modes through the observation's coronagraph and WFS configuration
# (unmodulated pyramid, NN reconstructor), right after the observation. Like run C / try7 (shaped Fourier modes)
# but without PSF blocks. Gives the NN's modevalWFS response to each Fourier mode
# (telem_screens.py --cal, step 2), camflowfs and camsci1 responses, the static field and g(n).
# camflowfs: mirrored to RTC with shmimTCP, and its INDI device visible on RTC (for its shutter during the dark).
# Before starting: internal source, same FPM/Lyot/filter as the observation, the observation's static DM offsets
# restored except the loop channel, fwscind at open, AO loop and camflowfs T/T loop open, turbulence off.
# camsci1 with EM gain on (30, as observed) at ~15 ms: at 59 ms the coronagraphic core alone reached 27k and the
# low-order modes saturated (skyF1_20261125T101247). xlinqCal stops if any frame passes sci.linearMax with EM gain > 1.
# Check first with --poke.last=29 (the brightest, lowest-order modes; ~15 s) and grep the log for linearMax.
# Run: xlinqCal -c runSkyFourier.conf   (~13 min); then step 2 (see runSky.conf)

[dm]
channel=dm01disp02
comb=dm01disp

[poke]
file=modFourier_48_shaped.fits   # shaped Fourier modes, ordered by max(|nx|,|ny|)
amp=0.5                    # half the shaped amplitudes: 1/4 the speckle intensity (EM gain 30)

[sci]
shmim=camsci1
nSettle=0
nFrames=1
linearMax=37000
satRadius=0                # not saturated: try7 peaked at ~24k
device=camsci1

[wfs]
shmim=aol1_imWFS2pub,aol1_modevalWFSpub,camflowfs

[snap]
shmim=aol1_wfsref,aol1_wfsmask

[indi]
enable=true
props=fwfpm.filterName,fwfpm.filter,fwfpm.counts,fwlyot.filterName,fwpupil.filterName,fwsci1.filterName,stagebs.presetName,stagescibs.presetName

[dark]
n=20
wfs=camflowfs              # its shutter is shut with camsci1's; _camflowfs_dark.fits

# No PSF blocks: through the coronagraph camsci1 is unsaturated at the open filter, so the ND-wheel PSF (for a
# saturated core) is not needed; the Fourier modes' known amplitudes give the intensity scale.

[seq]
nRepeat=1

[ref]
every=1

[out]
dir=skyF1
prefix=skyF1
