# Run D (step 2 of 3): cross-term calibration with random phase screens, right after run C with the same
# alignment, then the turbulence capture. Same conditions as run C: Lyot stop in, knife mask in (coronagraphic),
# fwscind at open, camsci1 at 36 ms, EM gain 1. Loop open, turbulence off.
# The screens (tools/make_screens.py) are random combinations of the 2400 Fourier modes with the turbulence
# residual's per-|n| variance (0.087 um rms commanded): 1200 at full amplitude, 400 at half, then the first 100
# repeated. The true phase of each acquisition is in the cube's COEFFS/SCALE extensions.
# Copy example/screens_turb_1700.fits next to this file. Run: xlinqCal -c runD.conf   (~9 min)
#
# Expected: speckle peaks up to ~36k counts near the core (model, 30 screens); occasional SCIMAX warnings
# inside ~15 px are expected and those pixels are masked in the analysis.

[dm]
channel=dm01disp02
comb=dm01disp

[poke]
file=screens_turb_1700.fits
amp=1                      # the cube is in um

[sci]
shmim=camsci1
nSettle=0
nFrames=1
linearMax=37000
satRadius=0
device=camsci1

[wfs]
shmim=aol1_imWFS2pub,aol1_modevalWFSpub

[snap]
shmim=aol1_wfsref,aol1_wfsmask

[indi]
enable=true
props=fwfpm.filterName,fwfpm.filter,fwfpm.counts,fwlyot.filterName,fwpupil.filterName,fwsci1.filterName,stagebs.presetName,stagescibs.presetName

[dark]
n=20

[psf]
n=50
wheel=fwscind
filter=ND3_0               # the wheel moves open -> ND3_0 -> open for each block
speckAmp=0.025             # as try7: ~25k counts peak at open (try7 CALMAX 24k)
speckSep=14
speckAngle=75              # two of the four speckles are in the transmitted half; psf_flux.py --nspeck 2
speckCross=true

[seq]
nRepeat=1

[ref]
every=1

[out]
dir=try9
prefix=try9
