# Run A: Lyot stop in, knife mask offset (non-coronagraphic), saturated at ND1_0 with an unsaturated low-order
# segment and PSF blocks at ND3_0. Before starting: fwscind at ND1_0, camsci1 EM gain 1.
# Run: xlinqCal -c runA.conf

[dm]
channel=dm01disp02
comb=dm01disp

[poke]
file=modFourier_48_shaped.fits   # shaped Fourier modes, ordered by max(|nx|,|ny|)
amp=1

[sci]
shmim=camsci1
nSettle=0
nFrames=1
linearMax=37000
satRadius=31               # covers the saturated core and the bleed stripe at ND1_0
device=camsci1

[wfs]
shmim=aol1_imWFS2pub,aol1_modevalWFSpub

[snap]
shmim=aol1_wfsref,aol1_wfsmask

[indi]
enable=true
props=fwfpm.filterName,fwfpm.filter,fwfpm.counts,fwlyot.filterName,fwpupil.filterName,fwsci1.filterName,stagebs.presetName,stagescibs.presetName

[dark]
n=20

[psf]
n=50                       # frames per PSF block plane
wheel=fwscind
filter=ND3_0               # unsaturated PSF and low-order segment
unsatLast=287              # modes 0-287 (max(|nx|,|ny|) <= 8, speckles within ~36 px) at ND3_0, the rest at ND1_0
speckAmp=0.009             # ~0.11% of the PSF flux per speckle: ~11k counts peak at ND1_0, ~110 at ND3_0 (estimated)
speckSep=14                # ~60 px from the core
speckAngle=75              # on the image diagonals, clear of the bleed stripe
speckCross=true

[seq]
nRepeat=1

[ref]
every=1

[out]
dir=try6
prefix=try6
