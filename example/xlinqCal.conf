# Example xlinqCal configuration. Run: xlinqCal -c xlinqCal.conf
# Any option can also be given on the command line, e.g. --poke.amp=0.05

[dm]
channel=dm01disp04
comb=dm01disp
#wait=2
#projTol=0.25

[poke]
file=/path/to/pokes.fits   # 50x50xNpoke, each shape 1 um rms
amp=0.05                   # um rms
#first=0
#last=-1

[sci]
shmim=camsci1              # on RTC via shmimTCP
nSettle=1
nFrames=10
#wait=5

[wfs]
shmim=aol1_imWFS2pub,aol1_modevalWFSpub   # calibrated frames + loop modal coefficients; or camwfs for raw frames

[snap]
shmim=aol1_wfsref,aol1_wfsmask            # saved with the calibration (and again at the end if changed)

[seq]
nRepeat=2

[ref]
every=1                    # zero-poke reference every N pokes, 0 = none (no even part)

[out]
dir=/path/to/output
#prefix=xlinqCal_<UTC>
#checkpointMin=10
