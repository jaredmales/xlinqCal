# Example xlinqCal configuration. Run: xlinqCal -c xlinqCal.conf
# Any option can also be given on the command line, e.g. --poke.amp=0.05

[dm]
channel=dm01disp04
comb=dm01disp
#wait=2
#projTol=0.25

[poke]
file=/path/to/pokes.fits   # 50x50xNpoke, each shape 1 um rms
amp=0.05                   # um rms
#first=0
#last=-1

[sci]
shmim=camsci1              # on RTC via shmimTCP
nSettle=1
nFrames=10
#wait=5

[wfs]
shmim=camwfs

[seq]
nRepeat=2

[out]
dir=/path/to/output
#prefix=xlinqCal_<UTC>
#checkpointMin=10
