# Example xlinqCal configuration. Run: xlinqCal -c xlinqCal.conf
# Any option can also be given on the command line, e.g. --poke.amp=0.05
# Give each key only once: a key repeated in a section has its values joined with no separator.

[dm]
channel=dm01disp04
comb=dm01disp
#wait=2
#projTol=0.25

[poke]
file=/path/to/pokes.fits   # 50x50xNpoke, each shape 1 um rms
amp=0.05                   # um rms
#first=0
#last=-1

[sci]
shmim=camsci1              # on RTC via shmimTCP
nSettle=1
nFrames=10
#wait=5
linearMax=37000           # camsci1 linearity limit [counts]; acquisitions above it are counted and warned
#satRadius=0               # radius [px] of a saturated core excluded from the linearity check
device=camsci1             # INDI device: exposure time, EM gain, shutter

[wfs]
shmim=aol1_imWFS2pub,aol1_modevalWFSpub   # calibrated frames + loop modal coefficients; or camwfs for raw frames

[snap]
shmim=aol1_wfsref,aol1_wfsmask            # saved with the calibration (and again at the end if changed)

[indi]
enable=true                # record INDI state at start and end (getINDI); needed for a dark
#props=                    # extra exact device.property names (devices visible from RTC's indiserver only)
#timeout=8
#poll=2                    # readback interval [s]; MagAOX asks for >= 2

[dark]
n=20                       # camsci1 frames with the shutter shut after a complete run, 0 = no dark
#discard=2
#wait=15

[psf]
#n=0                       # frames per PSF block plane, before and after the run; 0 = none
#wheel=fwscind
#filter=ND3_0              # the PSF filter; a run already at it (coronagraphic) takes the blocks in place
#discard=2                 # per DM change or wheel move, beyond the frame in progress
#wait=10
#unsatLast=-1              # pokes up to this index at psf.filter (unsaturated low orders), the rest saturated
#speckAmp=0                # [um] +/- calibration speckles at both filters, for the flux ratio; 0 = none
#speckSep=15               # [cycles across the DM]
#speckAngle=0              # [deg] from the DM first axis
#speckCross=true           # 4 speckles

[seq]
nRepeat=2

[ref]
every=1                    # zero-poke reference every N pokes, 0 = none (no even part)

[out]
dir=/path/to/output
#prefix=xlinqCal            # files are <prefix>_<UTC timestamp>_*; a prefix already used in dir is refused
#timestamp=true
#checkpointMin=10
