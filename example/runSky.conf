# Sky-residual calibration: after an on-sky coronagraphic observation, play back PCA modes and random screens
# of the observed AO residual on the internal source, before the coronagraph alignment changes.
# Order, all with the observation's coronagraph alignment and WFS configuration (unmodulated pyramid, NN):
#   1. xlinqCal -c runC.conf with out.dir/prefix changed: the try7 equivalent, giving the NN's modevalWFS
#      response to the Fourier modes (~13 min).
#   2. The cube, read straight from the observation's aol1_modevalWFS xrif archives:
#      python3 tools/telem_screens.py --input modeval <rawimages>/aol1_modevalWFS --start <UTC> --end <UTC> \
#          --modes modFourier_48.fits --cal <step-1 prefix> --out sky_screens.fits
#      Without step 1, map through the NN's basis instead: --loop-modes CMmodesDM.fits in place of --cal.
#      For a long observation add --every 5 (30 min of telemetry: ~12 min to accumulate, ~2.5 min with it).
#   3. This run.
# Planes: --n-pca PCA modes at 1 sigma, then random screens at scales 1, 0.5 and 1.5 (bracketing the pyramid's
# lower optical gain on sky), then 100 repeats; the Fourier coefficients of every plane are in COEFFS.
# Before starting: internal source, same coronagraph (FPM, Lyot, filter) as the observation, the observation's
# static DM offsets restored except the loop channel, camsci1 at 36 ms, EM gain 1, loop open, turbulence off.
# Run: xlinqCal -c runSky.conf   (telem_screens.py prints the run time, ~10 min for 1900 planes)

[dm]
channel=dm01disp02
comb=dm01disp

[poke]
file=sky_screens.fits
amp=1                      # the cube is in um

[sci]
shmim=camsci1
nSettle=0
nFrames=1
linearMax=37000
satRadius=0
device=camsci1

[wfs]
shmim=aol1_imWFS2pub,aol1_modevalWFSpub

[snap]
shmim=aol1_wfsref,aol1_wfsmask

[indi]
enable=true
props=fwfpm.filterName,fwfpm.filter,fwfpm.counts,fwlyot.filterName,fwpupil.filterName,fwsci1.filterName,stagebs.presetName,stagescibs.presetName

[dark]
n=20

[psf]
n=50
wheel=fwscind
filter=ND3_0               # the wheel moves open -> ND3_0 -> open for each block
speckAmp=0.025
speckSep=14
speckAngle=75
speckCross=true

[seq]
nRepeat=1

[ref]
every=1

[out]
dir=sky1
prefix=sky1
