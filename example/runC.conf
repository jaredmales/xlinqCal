# Run C (step 1 of 3): single-mode speckle calibration for the matched session (runC, runD, then a turbulence
# capture, all with the same alignment). Same as run B / try7: Lyot stop in, knife mask in (coronagraphic),
# shaped Fourier modes, with PSF blocks taking the calibration speckles at open and at ND3_0.
# Gives the fresh single-mode WFS responses, static field, pupil registration and g(n) that the screen and
# turbulence analyses use.
# Before starting: fwscind at open, camsci1 at 36 ms, EM gain 1, loop open, turbulence off.
# Run: xlinqCal -c runC.conf   (~13 min)

[dm]
channel=dm01disp02
comb=dm01disp

[poke]
file=modFourier_48_shaped.fits   # shaped Fourier modes, ordered by max(|nx|,|ny|)
amp=1

[sci]
shmim=camsci1
nSettle=0
nFrames=1
linearMax=37000
satRadius=0                # not saturated: try7 peaked at ~24k
device=camsci1

[wfs]
shmim=aol1_imWFS2pub,aol1_modevalWFSpub

[snap]
shmim=aol1_wfsref,aol1_wfsmask

[indi]
enable=true
props=fwfpm.filterName,fwfpm.filter,fwfpm.counts,fwlyot.filterName,fwpupil.filterName,fwsci1.filterName,stagebs.presetName,stagescibs.presetName

[dark]
n=20

[psf]
n=50
wheel=fwscind
filter=ND3_0               # the wheel moves open -> ND3_0 -> open for each block
speckAmp=0.025             # ~25k counts peak at open (try7 CALMAX 24k)
speckSep=14
speckAngle=75              # two of the four speckles are in the transmitted half; psf_flux.py --nspeck 2
speckCross=true

[seq]
nRepeat=1

[ref]
every=1

[out]
dir=try8
prefix=try8
